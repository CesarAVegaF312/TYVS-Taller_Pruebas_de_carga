# Puerto del servicio
server.port=8080

# Base de datos en memoria usada durante las pruebas de carga
registry.jdbc-url=jdbc:h2:mem:regdb;DB_CLOSE_DELAY=-1

# --- Observabilidad (Actuator + Micrometer) ---
# Se exponen solo los endpoints que el taller necesita.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Histograma de latencia por endpoint HTTP: permite comparar lo que mide k6
# desde el cliente con lo que mide el servidor. La diferencia entre ambos es
# tiempo de red y de encolamiento.
#
# Se publica el HISTOGRAMA (series http_server_requests_seconds_bucket), no
# percentiles calculados en el servidor: con Spring Boot 4 y el cliente de
# Prometheus 1.x, cuando hay histograma los percentiles del servidor ya no se
# exportan. El p95 se calcula a partir de los buckets (Grafana o Prometheus con
# histogram_quantile), que ademas es lo correcto: los percentiles de varias
# instancias no se pueden promediar, los buckets si se pueden sumar.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
