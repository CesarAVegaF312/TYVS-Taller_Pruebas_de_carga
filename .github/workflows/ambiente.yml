name: ambiente

# Verifica que el ambiente definido como codigo (.devcontainer y, si existe,
# docker-compose.yml) se construye y funciona. Corre cuando cambia algo del
# ambiente, y a mano desde la pestana Actions.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ambiente.yml'
      - 'docker-compose.yml'
      - '**/Dockerfile'
      - 'perf/observabilidad/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    name: Devcontainer se construye y la suite pasa adentro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: cd registraduria && mvn -B verify

  compose:
    name: Servicio, Prometheus, Grafana y k6 funcionan juntos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El archivo de compose es valido
        run: docker compose config -q
      - name: Levantar el ambiente
        run: docker compose up -d --build --wait
      - name: Corrida corta de k6 enviando metricas a Prometheus
        run: >
          docker compose run --rm k6 run --no-thresholds --vus 5 --duration 30s
          -o experimental-prometheus-rw
          --env BASE_URL=http://app:8080
          perf/scripts/register_person_k6.js
      - name: Cada panel del tablero tiene datos
        run: |
          sleep 15
          python3 - <<'PY'
          import json, sys, urllib.parse, urllib.request
          tablero = json.load(open("perf/observabilidad/grafana/dashboards/registraduria.json"))
          vacios = []
          for panel in tablero["panels"]:
              for t in panel["targets"]:
                  url = "http://localhost:9090/api/v1/query?" + urllib.parse.urlencode({"query": t["expr"]})
                  datos = json.load(urllib.request.urlopen(url))["data"]["result"]
                  print(("OK   " if datos else "VACIO"), t["legendFormat"], "<-", t["expr"])
                  if not datos:
                      vacios.append(t["legendFormat"])
          sys.exit(1 if vacios else 0)
          PY
      - name: Grafana cargo el tablero
        run: curl -fsS http://localhost:3000/api/dashboards/uid/tyvs-registraduria > /dev/null
      - name: Registros si algo fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v
