# Ambiente de medicion del taller: el servicio, quien lo observa y quien lo carga.
#
#   docker compose up -d --wait          # app + prometheus + grafana
#   docker compose run --rm k6 run -o experimental-prometheus-rw \
#     --env BASE_URL=http://app:8080 --env SCENARIO=load \
#     perf/scripts/register_person_k6.js
#   docker compose down                  # apaga todo
#
# Grafana queda en http://localhost:3000 con el tablero
# "Registraduria: cliente vs servidor" ya cargado.
name: tyvs-carga

services:
  app:
    build: ./registraduria
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Permite que k6 le ENVIE sus metricas (remote write). Asi las del
      # cliente y las del servidor quedan en la misma base y en la misma grafica.
      - --web.enable-remote-write-receiver
    volumes:
      - ./perf/observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # Ambiente local de aprendizaje: sin pantalla de login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./perf/observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./perf/observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Solo bajo demanda (docker compose run). No arranca con "up".
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    working_dir: /work
    # root para poder escribir perf/results/summary-*.json en la carpeta montada.
    user: root
    volumes:
      - .:/work
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # Percentiles que k6 envia a Prometheus (los mismos que mide el servidor).
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
    depends_on:
      - app
      - prometheus
